version: '3.8'

services:
  # Go API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - redis
      - security
    restart: unless-stopped
    networks:
      - aquaguard-network
    volumes:
      - api-data:/app/data

  # Rust Security Microservice
  security:
    build:
      context: ./security
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - aquaguard-network

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - aquaguard-network
    volumes:
      - redis-data:/data

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - aquaguard-network

networks:
  aquaguard-network:
    driver: bridge

volumes:
  api-data:
  redis-data:
